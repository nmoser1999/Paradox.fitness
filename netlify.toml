[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
  SITE_INDEXABLE = "true"
  ENABLE_DESIGN_REVIEW = "false"

[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"
  ENABLE_DESIGN_REVIEW = "true"

[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"
  ENABLE_DESIGN_REVIEW = "true"

# Production is indexable; deploy previews and branch deploys remain noindex.
