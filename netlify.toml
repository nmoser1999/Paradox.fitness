[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
  SITE_INDEXABLE = "false"
  ENABLE_DESIGN_REVIEW = "false"

[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"
  ENABLE_DESIGN_REVIEW = "true"

[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"
  ENABLE_DESIGN_REVIEW = "true"

# Set SITE_INDEXABLE=true in Netlify's production-context environment only
# after the domain, copy, offers, and email delivery have passed launch review.
